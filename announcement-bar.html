<!-- Dual Announcement Bar för Shopify HTML Block med Countdown -->
<style>
  .custom-announcement-wrapper {
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    z-index: 100;
  }

  .custom-announcement-bar {
    width: 100%;
    padding: 16px 20px;
    text-align: center;
    font-weight: 500;
    margin: 0;
  }

  /* Första announcement bar - Grön med Black Friday meddelande */
  .custom-announcement-bar.primary {
    background-color: #28FF1E;
    color: #000000;
    font-size: 18px;
    padding: 20px 20px;
  }

  .custom-announcement-text {
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Countdown styling */
  .countdown-container {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: 15px;
  }

  .countdown-item {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background-color: transparent;
    color: #000000;
    padding: 8px 12px;
    border-radius: 6px;
    min-width: 50px;
  }

  .countdown-number {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  .countdown-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .countdown-separator {
    font-size: 20px;
    font-weight: 700;
    color: #000000;
  }

  /* Responsiv design för mobil */
  @media screen and (max-width: 768px) {
    .custom-announcement-bar.primary {
      font-size: 16px;
      padding: 16px 15px;
    }

    .custom-announcement-text {
      display: block;
      margin-bottom: 12px;
    }

    .countdown-container {
      margin-left: 0;
      margin-top: 10px;
      gap: 6px;
    }

    .countdown-item {
      padding: 6px 10px;
      min-width: 45px;
      background-color: #000000;
      color: #28FF1E;
    }

    .countdown-number {
      font-size: 18px;
    }

    .countdown-label {
      font-size: 9px;
    }

    .countdown-separator {
      font-size: 18px;
    }
  }

  @media screen and (max-width: 480px) {
    .custom-announcement-bar.primary {
      font-size: 14px;
      padding: 14px 10px;
    }

    .countdown-container {
      gap: 4px;
    }

    .countdown-item {
      padding: 5px 8px;
      min-width: 40px;
    }

    .countdown-number {
      font-size: 16px;
    }

    .countdown-label {
      font-size: 8px;
    }

    .countdown-separator {
      font-size: 16px;
    }
  }
</style>

<div class="custom-announcement-wrapper">
  <!-- Första Announcement Bar med Countdown -->
  <div class="custom-announcement-bar primary">
    <p class="custom-announcement-text">
      BLACK FRIDAY REA – SLUTAR OM
      <span class="countdown-container" id="countdown">
        <span class="countdown-item">
          <span class="countdown-number" id="days">00</span>
          <span class="countdown-label">Dagar</span>
        </span>
        <span class="countdown-separator">:</span>
        <span class="countdown-item">
          <span class="countdown-number" id="hours">00</span>
          <span class="countdown-label">Tim</span>
        </span>
        <span class="countdown-separator">:</span>
        <span class="countdown-item">
          <span class="countdown-number" id="minutes">00</span>
          <span class="countdown-label">Min</span>
        </span>
        <span class="countdown-separator">:</span>
        <span class="countdown-item">
          <span class="countdown-number" id="seconds">00</span>
          <span class="countdown-label">Sek</span>
        </span>
      </span>
    </p>
  </div>
</div>

<script>
  // Sätt slutdatum till söndag 30 november 2025 kl 23:59:59
  const countdownDate = new Date('2025-11-30T23:59:59').getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = countdownDate - now;

    // Beräkna tid
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    // Uppdatera DOM
    document.getElementById('days').textContent = days.toString().padStart(2, '0');
    document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
    document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
    document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

    // Om countdown är slut
    if (distance < 0) {
      clearInterval(countdownInterval);
      document.getElementById('countdown').innerHTML = '<span style="font-weight: 700; color: #000;">Erbjudandet har gått ut!</span>';
    }
  }

  // Kör direkt och sen varje sekund
  updateCountdown();
  const countdownInterval = setInterval(updateCountdown, 1000);
</script>
